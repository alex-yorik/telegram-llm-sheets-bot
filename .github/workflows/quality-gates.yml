name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bandit:
    name: bandit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit==1.7.6

      - name: Run Bandit
        run: |
          bandit -c pyproject.toml -r . -ll -q

  coverage-gate:
    name: coverage-gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check coverage threshold
        run: |
          pytest --cov=. --cov-report=term-missing --cov-fail-under=80

  modularity:
    name: modularity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check file and function lengths
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          FILE_LIMIT = 500
          FUNCTION_LIMIT = 50
          SKIP_PARTS = {
              ".git",
              ".github",
              ".venv",
              "venv",
              ".ruff_cache",
              ".pytest_cache",
              "graphify-out",
              "__pycache__",
          }
          errors = []
          for path in Path(".").rglob("*.py"):
              if any(part in SKIP_PARTS for part in path.parts):
                  continue
              source = path.read_text(encoding="utf-8")
              if len(source.splitlines()) > FILE_LIMIT:
                  errors.append(f"{path}: file has more than {FILE_LIMIT} lines")
              tree = ast.parse(source, filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      length = node.end_lineno - node.lineno + 1
                      if length > FUNCTION_LIMIT:
                          errors.append(
                              f"{path}:{node.lineno} {node.name} has {length} lines"
                          )
          if errors:
              print("\n".join(errors))
              raise SystemExit(1)
          print("Modularity check passed")
          PY
