[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["."]
branch = true
omit = [
    "tests/*",
    "venv/*",
    ".venv/*",
    ".ruff_cache/*",
    ".pytest_cache/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "BLE"]

[tool.bandit]
exclude_dirs = [
    "tests",
    "venv",
    ".venv",
    ".git",
    ".ruff_cache",
    ".pytest_cache",
    "graphify-out",
]
