services:
  bot:
    build: .
    container_name: telegram-llm-sheets-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./credentials:/app/credentials:ro
      - ./data:/app/data
    # No healthcheck: checking that a process exists does not prove the bot
    # works (polling + LLM + Sheets). A real check needs an app-level probe,
    # so `restart: unless-stopped` handles crashes instead of a false "healthy".